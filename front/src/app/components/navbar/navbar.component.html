<nav class="navbar" [class.scrolled]="scrolled()">
  <div class="container navbar-inner">

    <a class="brand mono" (click)="scrollTo('#hero')">
      <span class="text-green">&lt;</span>FV
      <span class="text-green">/&gt;</span>
    </a>

    <ul class="nav-links" [class.open]="menuOpen()">
      @for (link of links; track link.href) {
        <li>
          <a class="nav-link mono" [class.active]="isActive(link.href)" (click)="scrollTo(link.href)">
            <span class="text-green">./</span>{{ link.label }}
          </a>
        </li>
      }
    </ul>

    <button class="hamburger" (click)="toggleMenu()" [class.active]="menuOpen()">
      <span></span><span></span><span></span>
    </button>

  </div>
</nav>
