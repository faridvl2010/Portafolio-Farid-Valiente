<div class="toast-stack">
  @for (t of svc.toasts(); track t.id) {
    <div class="toast" [class]="t.type" (click)="svc.remove(t.id)">
      @if (t.type === 'success') { <i class="fas fa-check-circle"></i> }
      @if (t.type === 'error')   { <i class="fas fa-times-circle"></i> }
      @if (t.type === 'info')    { <i class="fas fa-info-circle"></i> }
      <span>{{ t.message }}</span>
    </div>
  }
</div>
