services:
  # ── Backend Node.js ────────────────────────────────────────────
  - type: web
    name: portfolio-api
    runtime: node
    rootDir: back
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://portafolio-farid-valiente.vercel.app

  # ── Frontend Angular (static) ──────────────────────────────────
  - type: web
    name: portfolio-web
    runtime: static
    buildCommand: cd front && npm ci && npm run build -- --configuration production
    staticPublishPath: ./front/dist/portfolio/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
